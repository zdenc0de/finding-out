name: finding_out
description: "Explora tu ciudad"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management & Routing
  flutter_riverpod: ^2.5.1
  go_router: ^14.0.0  # <--- AGREGADO

  # Backend
  supabase_flutter: ^2.5.0
  
  # Maps & Location
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  geolocator: ^10.1.0
  geocoding: ^2.1.1
  
  # UI
  cached_network_image: ^3.3.1
  flutter_animate: ^4.5.0
  
  # Calendario
  table_calendar: ^3.0.9
  add_2_calendar: ^3.0.1
  
  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1
  json_annotation: ^4.9.0 # <--- AGREGADO
  flutter_dotenv: ^5.1.0  # Variables de entorno
  phosphor_flutter: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9    # <--- AGREGADO (necesario para generar código)
  json_serializable: ^6.8.0 # <--- AGREGADO
  mockito: ^5.4.4         # Para mocks en tests

flutter:
  assets:
    - .env